name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build
      - uses: actions/configure-pages@v5
      - name: Determine output folder
        id: output_dir
        run: |
          for d in .output/public dist/client dist; do
            if [ -f "$d/index.html" ]; then echo "path=$d" >> $GITHUB_OUTPUT; exit 0; fi
          done
          echo "No index.html found"; find . -name index.html -not -path "./node_modules/*"; exit 1
      - run: touch ${{ steps.output_dir.outputs.path }}/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output_dir.outputs.path }}

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
